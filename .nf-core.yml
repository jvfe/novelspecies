repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - assets/sendmail_template.txt
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml

template:
  org: nf-core
  name: novelspecies
  description: Genome-based species delimitation of bacterial isolates and MAGs against
    NCBI type strains using ANI and digital DDH
  author: jvfe
  version: 1.0.0dev
  force: true
  outdir: novelspecies
  skip_features:
    - igenomes
    - multiqc
    - fastqc
  is_nfcore: true
