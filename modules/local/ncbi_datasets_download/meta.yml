name: ncbi_datasets_download
description: Download selected NCBI Datasets genome packages for a genus (CLI only)
keywords:
  - ncbi
  - datasets
  - type strain
  - reference genome
tools:
  - ncbi-datasets-cli:
      description: NCBI Datasets command-line client
      homepage: https://www.ncbi.nlm.nih.gov/datasets/docs/v2/download-and-install/
      documentation: https://www.ncbi.nlm.nih.gov/datasets/docs/v2/
      licence: ["Public Domain"]
      identifier: biotools:ncbi_datasets
input:
  - - meta:
        type: map
        description: Groovy map with at least genus key
    - genus:
        type: string
        description: Target bacterial genus
output:
  - dataset:
      - - meta:
            type: map
        - ncbi_dataset.zip:
            type: file
            description: NCBI Datasets zip of selected assemblies
        - assembly_report.tsv:
            type: file
            description: Genome metadata table from dataformat
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
authors:
  - "@jvfe"
